name: Update answers
on:
  schedule:
    # Every 3 hours, since GitHub skips some scheduled runs. Safe to run often:
    # update.js never lets a day go backwards and only commits when data changed.
    # Minute 17 on purpose: GitHub drops more runs at :00.
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-
      - run: node update.js
      - run: node test.js
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update answers for $(date -u +%F)"
          git push
